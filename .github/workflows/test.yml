name: okonomiyaki

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
jobs:
  tests:
    strategy:
      matrix:
        python-version: [3.8, 3.11, 3.12, 3.14]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
        - os: macos-latest
          python-version: 3.6
    runs-on: ${{ matrix.os }}
    needs: code-lint
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install okonomiyaki
      run: python -m pip install -e .
    - name: Install test dependencies
      run: python -m pip install -e .[test] coverage
    - name: Test without dependencies
      run: |
        coverage run -p -m haas okonomiyaki.versions
    - name: Test with all dependencies
      run: |
        python -m pip install -e .[all]
        coverage run -p -m haas okonomiyaki       
    - name: Upload Coverage info
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-${{matrix.os}}-${{matrix.python-version}}
        path: coverage.*
  coverage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Download coverage artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
          pattern: coverage-*
          merge-multiple: true
    - name: Install coverage
      run: pip install coverage
    - name: Generate coverage report
      run: |
          pip install -e .
          coverage combine
          coverage report
          coverage html
    - name: Upload coverage report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-report
        path: htmlcov/*
  code-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python 3.8
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: 3.8
    - name: Install flake8
      run: python -m pip install flake8
    - name: Lint codebase
      run: python -m flake8 okonomiyaki/
